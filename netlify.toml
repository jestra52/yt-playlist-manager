# Netlify builds and serves the React app from web-react/, with the shared logic from packages/
# (npm workspaces, installed from the root). The .NET API runs on Render
# (see render.yaml); web-react/scripts/write-redirects.mjs proxies /api/* to it using the
# API_ORIGIN environment variable.

[build]
  command = "npm ci && npm run build -w web-react && node web-react/scripts/write-redirects.mjs"
  publish = "web-react/dist"
  # Skip the build (exit 0) when nothing the site uses changed since the last deploy, so
  # API-only and docs-only pushes don't redeploy the site. It builds (non-zero exit) when
  # there's no previous deploy, on "Clear cache and deploy" (same commit), and when the
  # previous commit isn't in the clone (git diff fails).
  ignore = """
    [ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] &&
    git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- web-react/ packages/ package.json package-lock.json netlify.toml
  """

[build.environment]
  NODE_VERSION = "22"

# Security and caching headers live in web-react/public/_headers.
