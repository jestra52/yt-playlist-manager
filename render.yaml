# Render Blueprint: the .NET sync API as a Docker web service.
# In Render: New → Blueprint → pick this repository. Fill in the values marked
# `sync: false` when Render asks for them.
services:
  - type: web
    name: yt-playlist-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /api/health
    autoDeploy: true
    # Only API changes deploy: web-only and docs-only pushes don't restart the container.
    # Tests don't change the image (api/.dockerignore leaves them out); CI still runs them.
    # Manual deploys and deploy hooks ignore these filters.
    buildFilter:
      paths:
        - api/**
        - render.yaml
      ignoredPaths:
        - api/**/*.md
        - api/tests/**
    envVars:
      # Neon connection string, e.g. postgresql://user:password@host/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Key for hashing sync chain codes and device credentials; Render generates a random one.
      # Never change it on a service in use: every chain code and device would stop working.
      - key: SYNC_PEPPER
        generateValue: true
      # Only for a library synced before sync chains: the old shared token, used once to claim
      # that library as a sync chain. New services don't need it.
      - key: SYNC_TOKEN
        sync: false
      # Optional: YouTube Data API key, to import whole playlists.
      - key: YOUTUBE_API_KEY
        sync: false
      # Optional: the Netlify site URL, to limit cross-origin calls (the site normally proxies /api).
      - key: ALLOWED_ORIGIN
        sync: false
