name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - name: Shared core (packages/core)
        working-directory: packages/core
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Migrations match tables.js
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- src/core/db/migrations)" ]; then
            echo "::error file=web/src/core/db/tables.js::tables.js changed without a migration. Run 'npm run db:generate' in web/ and commit the new files."
            git status --porcelain -- src/core/db/migrations
            exit 1
          fi
      - run: npm run build

  web-react:
    name: Web app (React beta)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  api:
    name: .NET API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ytplaylist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Runs the sync store tests against PostgreSQL with the real migrations too.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ytplaylist_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          ../.github/scripts/run-annotated.sh "dotnet restore" "error|warning NU" dotnet restore YtPlaylist.slnx
      - name: Build
        run: |
          ../.github/scripts/run-annotated.sh "dotnet build" ": error " dotnet build YtPlaylist.slnx --no-restore -c Release
      - name: Test
        env:
          SUMMARY_PATTERN: "Passed!|Failed!|Total tests"
        run: >-
          ../.github/scripts/run-annotated.sh "dotnet test"
          "Failed |Error Message|Assert|Expected|Actual|Exception|   at YtPlaylist"
          dotnet test YtPlaylist.slnx --no-build -c Release --logger "console;verbosity=normal"
      - name: Build the Docker image
        run: |
          ../.github/scripts/run-annotated.sh "docker build" "error|ERROR" docker build -t yt-playlist-manager-api .
