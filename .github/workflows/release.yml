name: Release

# Every merge into master is a release: tags v<api/VERSION> and publishes a GitHub Release,
# using the release PR's description as its notes. Does nothing when that tag already exists.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the version
        id: version
        run: |
          version="$(tr -d '[:space:]' < api/VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=api/VERSION::'$version' isn't a version like 1.2.3"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG already exists: bump api/VERSION in the release PR to publish a new release."
            exit 0
          fi
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.base.ref == "master")][0].number // empty')"
          if [ -n "$pr" ]; then
            {
              gh pr view "$pr" --json body --jq .body
              printf '\n\nRelease PR: #%s\n' "$pr"
            } > notes.md
          else
            echo "Released from $GITHUB_SHA." > notes.md
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest
