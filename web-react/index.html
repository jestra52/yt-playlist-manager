<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background-color: #f2f7fe;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        background-color: #101828;
      }
      html[data-theme='light'] {
        color-scheme: light;
        background-color: #f2f7fe;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          background-color: #101828;
        }
      }
      body {
        margin: 0;
      }
      .opening {
        display: grid;
        place-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: system-ui, sans-serif;
        opacity: 0.65;
      }
    </style>
    <script src="/theme-boot.js"></script>
    <meta
      name="description"
      content="Your own playlists of music and videos, in order, offline-first, synced across devices."
    />
    <meta name="application-name" content="Yuzu Tapes Playlist Manager" />
    <meta name="theme-color" content="#021431" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Yuzu Tapes Playlist Manager</title>
  </head>
  <body>
    <div id="root"><p class="opening">Opening your playlists…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
