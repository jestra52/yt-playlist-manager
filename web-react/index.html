<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background-color: #e9edf2;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        background-color: #0f1626;
      }
      html[data-theme='light'] {
        color-scheme: light;
        background-color: #e9edf2;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          background-color: #0f1626;
        }
      }
    </style>
    <script src="/theme-boot.js"></script>
    <meta
      name="description"
      content="Your own playlists of music and videos, in order, offline-first, synced across devices."
    />
    <meta name="application-name" content="Yuzu Tapes Playlist Manager" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Yuzu Tapes Playlist Manager (React beta)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
